name: p5
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build project
        run: npm run build

      - name: Run unit tests with coverage
        run: npm run test:coverage

      - name: Publish build and coverage artifact
        uses: actions/upload-artifact@v4
        with:
          name: cloudflare-worker-${{ github.sha }}
          path: |
            dist/
            coverage/
          if-no-files-found: error
          retention-days: 14

  deploy-production:
    needs: build-test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Download deployable build and coverage artifact
        uses: actions/download-artifact@v4
        with:
          name: cloudflare-worker-${{ github.sha }}
          path: artifacts/

      - name: Deploy to Cloudflare Workers
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.API_TOKEN }}
          accountId: ${{ secrets.ACCOUNT_ID }}
          command: deploy artifacts/dist/index.js